<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>SSHOW Dynamic Builder</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            overflow: hidden;
        }

        /* Fixed pixel mount for deterministic rendering (same as the engine's
           own test/figure harnesses). */
        sshow {
            position: relative;
            display: block;
            width: 1280px;
            height: 720px;
        }
    </style>
    <script type="importmap">
        { "imports": { "SSHOW": "/sshow.js" } }
    </script>
</head>

<body>
    <sshow></sshow>
    <script type="module">
        import SSHOW from 'SSHOW';

        window.__sshowReady = false;
        window.__sshowError = null;

        // Every program source the engine compiles, newest last. A compile
        // error counts its lines from the top of the program the engine wraps
        // around a pack's function; the runner finds the function in it.
        window.__shaderSources = [];
        const shaderSource = WebGL2RenderingContext.prototype.shaderSource;
        WebGL2RenderingContext.prototype.shaderSource = function (shader, source) {
            window.__shaderSources.push(source);
            return shaderSource.call(this, shader, source);
        };

        try {
            const sshow = new SSHOW();
            await sshow.init({
                renderer: {
                    container: document.querySelector('sshow')
                }
            });
            sshow.createScene();

            window.sshow = sshow;
            window.__sshowReady = true;
        } catch (error) {
            window.__sshowError = error?.message ?? String(error);
        }
    </script>
</body>

</html>
